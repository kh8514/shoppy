plugins { id 'java-library' }

dependencies {
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-webmvc'                  // GlobalExceptionHandler
    api 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'  // JWT, Security 포함
    api 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'       // 마이그레이션이 core 에 있음
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
}
